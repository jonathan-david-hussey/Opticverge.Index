name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore Opticverge.Index.sln

      - name: Restore dependencies
        run: dotnet restore Opticverge.Index.sln

      - name: Build
        run: dotnet build Opticverge.Index.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Opticverge.Index.sln --configuration Release --no-build --verbosity normal
